<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapzo Marketing Reports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
  :root { --bg: #f5f7fa; --fg: #16202e; --muted: #5d6878; --panel: #fff; --line: #dfe4ec; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f141b; --fg: #e8edf4; --muted: #9aa5b5; --panel: #171e28; --line: #2a3442; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  .eyebrow { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 400; font-size: 40px; margin: 8px 0 32px; }
  a.card { display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; color: inherit; text-decoration: none; }
  a.card:hover, a.card:focus-visible { border-color: var(--muted); }
  .t { font-weight: 600; font-size: 17px; } .d { color: var(--muted); font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Lapzo · Marketing</div>
  <h1>Reportes de marketing</h1>
  <ul>
    <li><a class="card" href="rrss/2026-11/"><span class="t">Redes sociales · 10 oct – 9 nov 2026</span><span class="d">Facebook, Instagram, LinkedIn y TikTok: alcance, interacción, formatos y top 10 de publicaciones.</span></a></li>
  </ul>
</main>
</body>
</html>
